name: Publish podcast

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish.yml'
      - 'cmd/**'
      - 'config/**'
      - 'episodes/**'
      - 'static/**'
      - 'go.mod'
      - 'go.sum'
      - 'mise.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: podcast-production
  cancel-in-progress: false

jobs:
  publish:
    needs: discover-new-episodes
    runs-on: ubuntu-24.04
    environment: production
    env:
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_STAGING_BUCKET: ${{ secrets.R2_STAGING_BUCKET }}
      R2_PUBLIC_BUCKET: ${{ secrets.R2_PUBLIC_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_PUBLISH_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_PUBLISH_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.6'

      - name: Require the main publication ref
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "Publication is allowed only from refs/heads/main; got ${GITHUB_REF}." >&2
            exit 1
          }

      - name: Validate release contract
        run: go run ./cmd/pplsite validate --config config/show.yaml --episodes episodes

      - name: Publish verified audio objects
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r staging_key public_key expected_sha expected_bytes; do
            [[ -z "$staging_key" ]] && continue

            if aws s3api head-object --bucket "$R2_PUBLIC_BUCKET" --key "$public_key" --endpoint-url "$R2_ENDPOINT" >/dev/null 2>&1; then
              remote_sha=$(aws s3api head-object --bucket "$R2_PUBLIC_BUCKET" --key "$public_key" --endpoint-url "$R2_ENDPOINT" --query 'Metadata.sha256' --output text)
              [[ "$remote_sha" == "$expected_sha" ]] || { echo "immutable public key has unexpected checksum: $public_key" >&2; exit 1; }
              continue
            fi

            temp_file=$(mktemp)
            trap 'rm -f "$temp_file"' EXIT
            aws s3 cp "s3://$R2_STAGING_BUCKET/$staging_key" "$temp_file" --endpoint-url "$R2_ENDPOINT"
            actual_sha=$(sha256sum "$temp_file" | awk '{print $1}')
            actual_bytes=$(wc -c < "$temp_file" | tr -d '[:space:]')
            [[ "$actual_sha" == "$expected_sha" ]] || { echo "staged audio checksum mismatch: $staging_key" >&2; exit 1; }
            [[ "$actual_bytes" == "$expected_bytes" ]] || { echo "staged audio byte count mismatch: $staging_key" >&2; exit 1; }

            aws s3 cp "$temp_file" "s3://$R2_PUBLIC_BUCKET/$public_key" \
              --endpoint-url "$R2_ENDPOINT" \
              --content-type audio/mpeg \
              --cache-control 'public, max-age=31536000, immutable' \
              --metadata "sha256=$expected_sha"
            rm -f "$temp_file"
            trap - EXIT
          done < <(go run ./cmd/pplsite publish-plan --episodes episodes)

      - name: Verify public enclosure endpoints
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r _ public_key _ _; do
            [[ -z "$public_key" ]] && continue
            url="https://media.pplstudyguide.com/$public_key"
            curl --fail --silent --show-error --retry 5 --retry-all-errors --head "$url" >/dev/null
            curl --fail --silent --show-error --retry 5 --retry-all-errors --range 0-1023 --output /dev/null "$url"
          done < <(go run ./cmd/pplsite publish-plan --episodes episodes)

      - name: Build homepage, show notes, and RSS feed
        run: go run ./cmd/pplsite build --config config/show.yaml --episodes episodes --out dist

      - name: Deploy static site to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy dist --project-name pplstudyguide --branch main

  discover-new-episodes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read
    outputs:
      episodes: ${{ steps.discover.outputs.episodes }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.6'

      - id: discover
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          queued=$(mktemp)
          trap 'rm -f "$queued"' EXIT
          candidates=$(go run ./cmd/pplsite release-candidates --episodes episodes --json)
          jq -e 'type == "array"' >/dev/null <<<"$candidates"
          while IFS= read -r candidate; do
            id=$(jq -er '.id' <<<"$candidate")
            release_key=$(jq -er '.release_key' <<<"$candidate")
            content_version=$(jq -er '.content_version' <<<"$candidate")
            state=$(bash scripts/release-state.sh "$release_key" "$content_version" "$id")
            case "$state" in
              complete) continue ;;
              missing|draft|orphan-tag) printf '%s\n' "$candidate" >>"$queued" ;;
              published-missing-asset|published-invalid|published-record-mismatch)
                echo "Published GitHub Release ${release_key}/v${content_version} is not a valid immutable release record (${state}); refusing to overwrite it." >&2
                exit 1
                ;;
              *) echo "Unknown release state for ${release_key}/v${content_version}: ${state}" >&2; exit 1 ;;
            esac
          done < <(jq -c '.[]' <<<"$candidates")
          jq -sc . "$queued" | { read -r episodes; echo "episodes=$episodes" >> "$GITHUB_OUTPUT"; }

  attest-and-release:
    needs: [discover-new-episodes, publish]
    if: needs.discover-new-episodes.outputs.episodes != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        episode: ${{ fromJSON(needs.discover-new-episodes.outputs.episodes) }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.6'

      - name: Build publication record
        run: >-
          go run ./cmd/pplsite release-record
          --episode episodes/${{ matrix.episode.id }}/episode.yaml
          --out release-records/${{ matrix.episode.release_key }}-v${{ matrix.episode.content_version }}.json
          --commit ${{ github.sha }}

      - name: Attest publication record
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-records/${{ matrix.episode.release_key }}-v${{ matrix.episode.content_version }}.json

      - name: Create GitHub release record
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EPISODE_ID: ${{ matrix.episode.id }}
          RELEASE_KEY: ${{ matrix.episode.release_key }}
          CONTENT_VERSION: ${{ matrix.episode.content_version }}
          PUBLISHED_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/publish-release.sh \
            "$RELEASE_KEY" \
            "$CONTENT_VERSION" \
            "release-records/${RELEASE_KEY}-v${CONTENT_VERSION}.json" \
            "$EPISODE_ID" \
            "$PUBLISHED_COMMIT"
