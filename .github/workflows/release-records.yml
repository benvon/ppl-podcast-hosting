name: Attest published episode records

on:
  workflow_run:
    workflows: [Publish podcast]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  discover-new-episodes:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    outputs:
      episodes: ${{ steps.discover.outputs.episodes }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - id: discover
        env:
          AFTER: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if ! BEFORE=$(git rev-parse "$AFTER^" 2>/dev/null); then
            echo 'episodes=[]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mapfile -t ids < <(git diff --diff-filter=A --name-only "$BEFORE" "$AFTER" -- 'episodes/*/episode.yaml' | sed -nE 's#^episodes/([^/]+)/episode\.yaml$#\1#p' | sort -u)
          printf '%s\n' "${ids[@]:-}" | jq -Rsc 'split("\n") | map(select(length > 0))' | { read -r episodes; echo "episodes=$episodes" >> "$GITHUB_OUTPUT"; }

  attest-and-release:
    needs: discover-new-episodes
    if: needs.discover-new-episodes.outputs.episodes != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        episode: ${{ fromJSON(needs.discover-new-episodes.outputs.episodes) }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'

      - name: Build publication record
        run: >-
          go run ./cmd/pplsite release-record
          --episode episodes/${{ matrix.episode }}/episode.yaml
          --out release-records/${{ matrix.episode }}.json
          --commit ${{ github.event.workflow_run.head_sha }}

      - name: Attest publication record
        uses: actions/attest@v4
        with:
          subject-path: release-records/${{ matrix.episode }}.json

      - name: Create GitHub release record
        env:
          GH_TOKEN: ${{ github.token }}
          EPISODE: ${{ matrix.episode }}
        shell: bash
        run: |
          set -euo pipefail
          tag="episode-${EPISODE}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub release record already exists for ${tag}; leaving it immutable."
            exit 0
          fi
          gh release create "$tag" "release-records/${EPISODE}.json" \
            --title "Published ${EPISODE}" \
            --notes "Machine-readable publication record for ${EPISODE}. Its SHA-256 is independently attested by GitHub Actions."
