name: Validate pull request

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.6'

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Run publisher tests
        run: go test ./... && node --test scripts/*.test.cjs

      - name: Validate sealed episode packages
        run: go run ./cmd/pplsite validate --config config/show.yaml --episodes episodes

      - name: Build static podcast site
        run: go run ./cmd/pplsite build --config config/show.yaml --episodes episodes --out dist
